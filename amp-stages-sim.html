<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amplifier Stages</title>
<style>
  :root { --bg:#f6f7fb; --panel:#ffffff; --ink:#1a2233; --muted:#5b6478; --accent:#1f6fd6; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI", Roboto, Arial, sans-serif; overflow:hidden; }
  #wrap { position:absolute; inset:0; display:flex; flex-direction:column; }
  #stage { flex:1; position:relative; }
  canvas { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:7px 16px;
    background:var(--panel); border-top:1px solid #dfe3ea; font-size:15px; }
  .row label { color:var(--muted); }
  .val { min-width:70px; font-weight:bold; }
  input[type=range] { width:170px; accent-color:var(--accent); }
  button { background:#eef1f6; color:var(--ink); border:1px solid #cfd5e0; border-radius:6px;
    padding:6px 11px; font-size:14px; cursor:pointer; }
  button:hover { background:#e2e7f0; }
  button.on { background:#dbe9fb; border-color:#1f6fd6; font-weight:bold; }
  .sp { flex:1; }
  .keys { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c"></canvas></div>
  <div class="row" id="ctl"></div>
</div>
<script>
"use strict";
// ======================================================================
// Model: mic (mV) -> optional pre-amp x200 -> power amp -> speaker
// ======================================================================
const FS = 0.6;                       // on-screen signal frequency (slowed down)
const RAIL = 12;                      // power amp output limit (V)
const MODES = [
  { name: "1  Mic straight to power amp", pre: 1, pa: 10 },
  { name: "2  Power amp at full gain", pre: 1, pa: 30 },
  { name: "3  Pre-amp, then power amp", pre: 200, pa: 10 },
];
const S = { mode: 0, mic: 0.005 };    // mic output peak (V)
const sin = Math.sin, TAU = 2 * Math.PI;
const clip = v => Math.max(-RAIL, Math.min(RAIL, v));
const M = () => MODES[S.mode];
const micV = tt => S.mic * sin(TAU * FS * tt);
const paIn = tt => M().pre * micV(tt);
const outV = tt => clip(M().pa * paIn(tt));
const lvl = () => { const m = M(), pre = m.pre * S.mic; return { mic: S.mic, pre, out: Math.min(m.pa * pre, RAIL), want: m.pa * pre }; };

// ======================================================================
// Canvas + drawing helpers
// ======================================================================
const W = 1400, H = 760;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
function fit() {
  const st = document.getElementById("stage");
  const s = Math.min(st.clientWidth / W, st.clientHeight / H), dpr = window.devicePixelRatio || 1;
  cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
  cv.width = W * s * dpr; cv.height = H * s * dpr; ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
window.addEventListener("resize", fit);

const INK = "#1a2233", MUTED = "#5b6478", GRID = "#e1e5ec", WIRE = "#4a5468", OFFC = "#b8bfcc";
const CIN = "#e07a00", COUT = "#1f6fd6", GOOD = "#18a058", BAD = "#d93636";

function font(size, weight) { return `${weight} ${size}px Segoe UI, Arial`; }
function parseRich(str) {
  const out = []; const rx = /_\{([^}]*)\}|_([A-Za-z0-9+\-−])/g; let pos = 0, m;
  while ((m = rx.exec(str))) {
    if (m.index > pos) out.push({ t: str.slice(pos, m.index), s: false });
    out.push({ t: m[1] !== undefined ? m[1] : m[2], s: true }); pos = rx.lastIndex;
  }
  if (pos < str.length) out.push({ t: str.slice(pos), s: false });
  return out;
}
function richWidth(str, size, weight = "normal") {
  let w = 0;
  for (const p of parseRich(str)) { ctx.font = font(p.s ? size * 0.66 : size, weight); w += ctx.measureText(p.t).width; }
  return w;
}
function text(str, x, y, size = 16, color = INK, align = "left", weight = "normal") {
  const segs = parseRich(String(str)), w = richWidth(String(str), size, weight);
  let cx = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  ctx.fillStyle = color; ctx.textBaseline = "middle"; ctx.textAlign = "left";
  for (const p of segs) {
    ctx.font = font(p.s ? size * 0.66 : size, weight);
    ctx.fillText(p.t, cx, p.s ? y + size * 0.3 : y); cx += ctx.measureText(p.t).width;
  }
  return cx;
}
function poly(pts, color = WIRE, w = 3.5, dash) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.setLineDash(dash || []);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.stroke();
  ctx.setLineDash([]);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function box(x, y, w, h, fill = "#fff", stroke = "#dfe3ea") {
  roundRect(x, y, w, h, 12); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke();
}
function dot(x, y, r = 6, c = INK) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function fmtV(v) {
  v = Math.abs(v);
  if (v >= 1) return (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + " V";
  if (v >= 0.001) return (v * 1000 >= 10 ? (v * 1000).toFixed(0) : (v * 1000).toFixed(1)) + " mV";
  return (v * 1e6).toFixed(0) + " µV";
}
// sound waves: arcs moving outwards
function waves(x, y, r0, r1, alpha, color, ang = 0.7, jag = 0) {
  if (alpha <= 0.01) return;
  const off = (t * 70) % 26;
  for (let rr = r0 + off; rr < r1; rr += 26) {
    const fade = 1 - (rr - r0) / (r1 - r0);
    ctx.strokeStyle = color; ctx.globalAlpha = Math.max(0, fade) * Math.min(1, alpha); ctx.lineWidth = 3;
    ctx.beginPath();
    for (let k = 0; k <= 24; k++) {
      const a = -ang + 2 * ang * k / 24, r = rr + (jag ? jag * sin(k * 7.3 + t * 40 + rr) : 0);
      const px = x + r * Math.cos(a), py = y + r * Math.sin(a);
      k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function amp(cx, cy, w, h, o) {
  const x0 = cx - w / 2, x1 = cx + w / 2;
  ctx.setLineDash(o.ghost ? [8, 7] : []);
  ctx.fillStyle = o.ghost ? "rgba(255,255,255,0.6)" : o.fill; ctx.strokeStyle = o.ghost ? OFFC : INK; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(x0, cy - h / 2); ctx.lineTo(x1, cy); ctx.lineTo(x0, cy + h / 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.setLineDash([]);
  return { in: x0, out: x1 };
}

// ---------- scope: rolling traces over the last WIN seconds
const WIN = 4;
function scope(x, y, w, h, o) {
  box(x, y, w, h);
  text(o.title, x + 16, y + 24, 18, INK, "left", "bold");
  const gx = x + 14, gy = y + 46, gw = w - 28, gh = h - 82, nx = 10, ny = 8;
  ctx.fillStyle = "#fbfcfe"; ctx.fillRect(gx, gy, gw, gh);
  ctx.strokeStyle = GRID; ctx.lineWidth = 1;
  for (let i = 0; i <= nx; i++) { ctx.beginPath(); ctx.moveTo(gx + gw * i / nx, gy); ctx.lineTo(gx + gw * i / nx, gy + gh); ctx.stroke(); }
  for (let j = 0; j <= ny; j++) { ctx.beginPath(); ctx.moveTo(gx, gy + gh * j / ny); ctx.lineTo(gx + gw, gy + gh * j / ny); ctx.stroke(); }
  ctx.strokeStyle = "#c5ccd8"; ctx.beginPath(); ctx.moveTo(gx, gy + gh / 2); ctx.lineTo(gx + gw, gy + gh / 2); ctx.stroke();
  const cy = gy + gh / 2, k = (gh / ny) / o.vdiv;
  for (const m of o.marks || []) poly([[gx, cy - m.v * k], [gx + gw, cy - m.v * k]], m.c, 2, [7, 5]);
  ctx.save(); ctx.beginPath(); ctx.rect(gx, gy, gw, gh); ctx.clip();
  ctx.strokeStyle = o.color; ctx.lineWidth = 3; ctx.beginPath();
  for (let px = 0; px <= gw; px += 1) {
    const tau = t - WIN + WIN * px / gw, py = cy - o.f(tau) * k;
    px ? ctx.lineTo(gx + px, py) : ctx.moveTo(gx + px, py);
  }
  ctx.stroke(); ctx.restore();
  if (o.note) text(o.note, gx, gy + gh + 20, 14, o.noteColor || MUTED, "left", "bold");
  text(o.unit, gx + gw, gy + gh + 20, 13, MUTED, "right");
}

// ======================================================================
// Layout: chain on top, signal funnel in the middle, scopes at the bottom
// ======================================================================
const CY = 175;                                   // signal line height
const X = { mic: 180, preIn: 345, preOut: 475, paIn: 655, paOut: 865, spk: 990 };
const Y0 = 412, HMAX = 92;                        // funnel strip centre line and largest half height
const px = v => HMAX * Math.pow(Math.min(Math.abs(v), RAIL) / RAIL, 0.45);   // size on screen (compressed scale)

function drawChain() {
  const m = M(), pre = m.pre > 1, L = lvl();
  // voice into the mic
  text("Voice", 58, CY - 62, 16, MUTED, "center", "bold");
  waves(40, CY, 8, 92, 0.35 + S.mic / 0.02, CIN, 0.55);
  // mic: head + handle
  ctx.fillStyle = "#3a4256"; ctx.beginPath(); ctx.moveTo(140, CY + 18); ctx.lineTo(160, CY + 18); ctx.lineTo(154, CY + 84); ctx.lineTo(146, CY + 84); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c9ced8"; ctx.strokeStyle = "#3a4256"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(150, CY, 24, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "#7a8396"; ctx.lineWidth = 1.5;
  for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(150 + k * 8, CY - 22 + Math.abs(k) * 2); ctx.lineTo(150 + k * 8, CY + 22 - Math.abs(k) * 2); ctx.stroke(); }
  text("Mic", 150, CY + 104, 17, INK, "center", "bold");
  // wires
  poly([[X.mic - 6, CY], [X.preIn, CY]]);
  poly([[X.preOut, CY], [X.paIn, CY]]);
  if (!pre) poly([[X.preIn, CY], [X.preOut, CY]]);
  // pre-amp
  const P = amp((X.preIn + X.preOut) / 2, CY, X.preOut - X.preIn, 120, { fill: "#ffe2c8", ghost: !pre });
  text("×200", P.in + 44, CY, 20, pre ? INK : OFFC, "center", "bold");
  text("Pre-amp", (X.preIn + X.preOut) / 2, CY + 86, 18, pre ? INK : OFFC, "center", "bold");
  text(pre ? "small signal" : "not used", (X.preIn + X.preOut) / 2, CY + 110, 15, pre ? MUTED : OFFC, "center");
  // power amp with heatsink fins
  const PA = amp((X.paIn + X.paOut) / 2, CY, X.paOut - X.paIn, 170, { fill: "#f8d0d0" });
  ctx.fillStyle = "#8a93a6";
  for (let k = 0; k < 7; k++) ctx.fillRect(X.paIn + 8 + k * 14, CY - 112 - (k % 2) * 6, 8, 26 + (k % 2) * 6);
  const turned = m.pa > 10;
  text("×" + m.pa + (turned ? " max" : ""), PA.in + 70, CY, 22, turned ? BAD : INK, "center", "bold");
  text("Power amp", (X.paIn + X.paOut) / 2, CY + 110, 18, INK, "center", "bold");
  text("needs about 1 V in", (X.paIn + X.paOut) / 2, CY + 134, 15, MUTED, "center");
  // speaker
  poly([[X.paOut, CY], [X.spk - 30, CY]]);
  const d = outV(t) / RAIL * 18;
  ctx.fillStyle = "#3a4256"; ctx.fillRect(X.spk - 30, CY - 24, 22, 48);
  ctx.fillStyle = "#5b6478"; ctx.beginPath(); ctx.moveTo(X.spk - 8, CY - 24); ctx.lineTo(X.spk + 34 + d, CY - 62); ctx.lineTo(X.spk + 34 + d, CY + 62); ctx.lineTo(X.spk - 8, CY + 24); ctx.closePath(); ctx.fill();
  text("Speaker 8 Ω", X.spk + 4, CY + 92, 17, INK, "center", "bold");
  waves(X.spk + 40, CY, 10, 200, L.out / 6, COUT, 0.62);
}

// funnel: a horn from half height h0 to h1 between x0 and x1
function funnel(x0, x1, h0, h1, fill, stroke, ghost) {
  const top = u => Y0 - (h0 + (h1 - h0) * u * u);          // flared horn
  ctx.beginPath(); ctx.moveTo(x0, Y0 - h0);
  for (let k = 1; k <= 30; k++) { const u = k / 30; ctx.lineTo(x0 + (x1 - x0) * u, top(u)); }
  for (let k = 30; k >= 0; k--) { const u = k / 30; ctx.lineTo(x0 + (x1 - x0) * u, 2 * Y0 - top(u)); }
  ctx.closePath();
  ctx.fillStyle = ghost ? "rgba(255,255,255,0)" : fill; ctx.fill();
  ctx.strokeStyle = ghost ? OFFC : stroke; ctx.lineWidth = 4; ctx.setLineDash(ghost ? [8, 7] : []);
  ctx.beginPath(); ctx.moveTo(x0, Y0 - h0); for (let k = 1; k <= 30; k++) { const u = k / 30; ctx.lineTo(x0 + (x1 - x0) * u, top(u)); } ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x0, Y0 + h0); for (let k = 1; k <= 30; k++) { const u = k / 30; ctx.lineTo(x0 + (x1 - x0) * u, 2 * Y0 - top(u)); } ctx.stroke();
  ctx.setLineDash([]);
}
function bracket(x, h, color, label) {
  poly([[x, Y0 - h], [x, Y0 + h]], color, 3);
  poly([[x - 7, Y0 - h], [x + 7, Y0 - h]], color, 3); poly([[x - 7, Y0 + h], [x + 7, Y0 + h]], color, 3);
  if (label) text(label, x + 10, Y0 + h + 15, 14, color, "right", "bold");
}
function drawFunnels() {
  const m = M(), pre = m.pre > 1, L = lvl();
  box(30, 296, 1010, 228);
  text("Signal size", 50, 318, 17, INK, "left", "bold");
  // each amplifier is a funnel made for one input size and one output size
  funnel(X.preIn, X.preOut, px(0.005) + 6, px(1) + 6, "#ffe2c8aa", CIN, !pre);
  funnel(X.paIn, X.paOut, px(1) + 6, px(10) + 6, "#f8d0d0aa", BAD, false);
  // the wave and its size along the chain
  const A = x => {
    if (x < X.preIn) return px(L.mic);
    if (x < X.preOut) { const u = (x - X.preIn) / (X.preOut - X.preIn); return pre ? px(L.mic) + (px(L.pre) - px(L.mic)) * u * u : px(L.mic); }
    if (x < X.paIn) return px(L.pre);
    if (x < X.paOut) { const u = (x - X.paIn) / (X.paOut - X.paIn); return px(L.pre) + (px(L.out) - px(L.pre)) * u * u; }
    return px(L.out);
  };
  const x0 = X.mic - 20, x1 = X.spk + 10, lam = 46, ph = TAU * FS * 2 * t;
  ctx.fillStyle = COUT + "1c"; ctx.beginPath(); ctx.moveTo(x0, Y0 - A(x0));
  for (let x = x0; x <= x1; x += 3) ctx.lineTo(x, Y0 - A(x));
  for (let x = x1; x >= x0; x -= 3) ctx.lineTo(x, Y0 + A(x));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = COUT; ctx.lineWidth = 3; ctx.beginPath();
  for (let x = x0; x <= x1; x += 2) { const y = Y0 - A(x) * sin(TAU * x / lam - ph); x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
  ctx.stroke();
  // what each stage is made for
  text("made for 1 V in", X.paIn - 8, Y0 - px(1) - 12, 14, BAD, "right", "bold");
  if (pre) text("made for mV in", X.preIn - 8, Y0 + 24, 14, CIN, "right", "bold");
  bracket(X.spk + 24, px(10), GOOD, "full volume");
  // sizes
  text(fmtV(L.mic), X.mic, Y0 - px(L.mic) - 16, 15, COUT, "left", "bold");
  text(fmtV(L.pre), (X.preOut + X.paIn) / 2, Y0 + px(L.pre) + 18, 15, COUT, "center", "bold");
  text(fmtV(L.out), X.spk - 30, Y0 - px(L.out) - 16, 15, COUT, "right", "bold");
  if (L.pre < 0.3) text("too small to fill it", (X.paIn + X.paOut) / 2 + 20, Y0 + 24, 15, BAD, "center", "bold");
}

function drawReadout() {
  const m = M(), L = lvl();
  box(1056, 296, 314, 228);
  text("Mic gives " + fmtV(L.mic), 1074, 326, 19, INK, "left", "bold");
  text("Power amp wants about 1 V", 1074, 358, 17, MUTED, "left", "bold");
  text("Power amp gets " + fmtV(L.pre), 1074, 390, 19, L.pre < 0.3 ? BAD : GOOD, "left", "bold");
  let s, c;
  if (L.want > RAIL) { s = "CLIPPING"; c = BAD; }
  else if (L.pre < 0.3) { s = m.pa > 10 ? "STILL TOO SMALL" : "TOO SMALL"; c = BAD; }
  else { s = "FITS: FULL VOLUME"; c = GOOD; }
  roundRect(1070, 418, 286, 40, 8); ctx.fillStyle = c + "18"; ctx.fill();
  text(s, 1084, 439, 19, c, "left", "bold");
  text("speaker " + fmtV(L.out), 1074, 488, 19, COUT, "left", "bold");
}

function draw() {
  text("Amplifier Stages", 40, 30, 28, INK, "left", "bold");
  drawChain();
  drawFunnels();
  drawReadout();
  const L = lvl(), small = L.pre < 0.3;
  scope(30, 534, 440, 218, { title: "Mic output", f: tt => micV(tt) * 1000, vdiv: 2, unit: "2 mV/div", color: CIN });
  scope(480, 534, 440, 218, { title: "Power amp input", f: paIn, vdiv: 0.5, unit: "0.5 V/div", color: COUT,
    marks: [{ v: 1, c: GOOD }, { v: -1, c: GOOD }],
    note: small ? "needs about ±1 V: " + Math.round(1 / L.pre) + " times bigger" : "needs about ±1 V", noteColor: small ? BAD : GOOD });
  scope(930, 534, 440, 218, { title: "Speaker", f: outV, vdiv: 5, unit: "5 V/div", color: COUT,
    marks: [{ v: RAIL, c: BAD + "aa" }, { v: -RAIL, c: BAD + "aa" }] });
}

// ======================================================================
// Controls
// ======================================================================
const ctl = document.getElementById("ctl");
let t = 0, paused = false;
function setMode(k) { S.mode = k; build(); }
function build() {
  ctl.innerHTML = "";
  MODES.forEach((m, i) => {
    const b = document.createElement("button"); b.textContent = m.name; if (i === S.mode) b.classList.add("on");
    b.addEventListener("click", () => setMode(i)); ctl.appendChild(b);
  });
  const l = document.createElement("label"); l.textContent = "Voice level";
  const i = document.createElement("input"); i.type = "range"; i.min = 1; i.max = 20; i.step = 1; i.value = S.mic * 1000;
  const o = document.createElement("span"); o.className = "val"; o.textContent = fmtV(S.mic);
  i.addEventListener("input", () => { S.mic = +i.value / 1000; o.textContent = fmtV(S.mic); });
  ctl.append(l, i, o);
  const sp = document.createElement("span"); sp.className = "sp"; ctl.appendChild(sp);
  const pb = document.createElement("button"); pb.id = "pause"; pb.textContent = paused ? "Play (Space)" : "Pause (Space)";
  pb.addEventListener("click", togglePause); ctl.appendChild(pb);
  const ks = document.createElement("span"); ks.className = "keys"; ks.textContent = "1 to 3: modes   F: fullscreen"; ctl.appendChild(ks);
}
function togglePause() { paused = !paused; const b = document.getElementById("pause"); if (b) b.textContent = paused ? "Play (Space)" : "Pause (Space)"; }
window.addEventListener("keydown", e => {
  if (e.key >= "1" && e.key <= "3") setMode(+e.key - 1);
  else if (e.key === " ") { e.preventDefault(); togglePause(); }
  else if (e.key === "f" || e.key === "F") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) t += dt;
  ctx.fillStyle = "#f6f7fb"; ctx.fillRect(0, 0, W, H);
  draw();
  requestAnimationFrame(frame);
}
build(); fit(); requestAnimationFrame(frame);
</script>
</body>
</html>
