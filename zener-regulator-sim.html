<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zener Regulator</title>
<style>
  :root { --bg:#f6f7fb; --panel:#ffffff; --ink:#1a2233; --muted:#5b6478; --accent:#1f6fd6; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI", Roboto, Arial, sans-serif; overflow:hidden; }
  #wrap { position:absolute; inset:0; display:flex; flex-direction:column; }
  #stage { flex:1; position:relative; }
  canvas { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
  #bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 16px;
    background:var(--panel); border-top:1px solid #dfe3ea; font-size:15px; }
  #bar label { color:var(--muted); }
  #vinv { min-width:64px; font-weight:bold; }
  input[type=range] { width:240px; accent-color:var(--accent); }
  button { background:#eef1f6; color:var(--ink); border:1px solid #cfd5e0; border-radius:6px;
    padding:7px 12px; font-size:14px; cursor:pointer; }
  button:hover { background:#e2e7f0; }
  button.on { background:#e6f4d7; border-color:#7fb24a; }
  button.warn { background:#fde2e2; border-color:#d93636; }
  .sp { flex:1; }
  .keys { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="bar">
    <label for="vin">V<sub>in</sub></label>
    <input id="vin" type="range" min="0" max="12" step="0.1" value="9">
    <span id="vinv">9.0 V</span>
    <button id="l0" class="on">No load (S1 open)</button>
    <button id="l1">1 k&Omega;</button>
    <button id="l2">470 &Omega;</button>
    <button id="rs">R<sub>S</sub> 22 &Omega; (too small)</button>
    <button id="rep">Replace Zener</button>
    <button id="rec">Record (R)</button>
    <button id="swp">Sweep 0 to 12 V</button>
    <button id="flt">Zener backwards (fault)</button>
    <button id="clr">Clear</button>
    <span class="sp"></span>
    <span class="keys">Left/Right: V<sub>in</sub> &nbsp; 1 2 3: load &nbsp; R: record &nbsp; S: sweep &nbsp; F: fullscreen</span>
  </div>
</div>
<script>
"use strict";
// ---------- model: V_in, R_S 330, 5.1 V Zener, optional R_L ----------
let RS = 330; const VZ = 5.1, PMAX = 1.0, THETA = 150, TBURN = 200;   // 1N4733A: 1 W
const LOADS = [
  { name: "No load", short: "No load", R: 0, col: "#1a2233" },
  { name: "1 kΩ", short: "1 kΩ", R: 1000, col: "#e07a00" },
  { name: "470 Ω", short: "470 Ω", R: 470, col: "#c2185b" },
];
let vin = 9, load = 0, fault = false, burnt = false, temp = 25, smoke = [];

const softplus = x => (x > 30 ? x : Math.log1p(Math.exp(x)));
// current down through the Zener (cathode on top) for a voltage V across it
const iz0 = V => (0.1 / 2) * softplus((V - 5.12) / 0.1);           // healthy Zener, reverse: knee ~5.1 V, Rz ~2 ohm
function iz(V, rev) {
  if (burnt) return V / 0.5;                                      // failed short
  if (rev) return (0.03 / 1.5) * softplus((V - 0.62) / 0.03);   // backwards: forward diode, ~0.7 V
  return iz0(V);
}
function solve(vi, li, rev) {
  if (vi <= 0) return { vo: 0, is: 0, iz: 0, il: 0 };
  const R = LOADS[li].R;
  let lo = 0, hi = vi;
  for (let k = 0; k < 60; k++) {
    const m = (lo + hi) / 2;
    const g = (vi - m) / RS - iz(m, rev) - (R ? m / R : 0);
    if (g > 0) lo = m; else hi = m;
  }
  const vo = (lo + hi) / 2;
  return { vo, is: (vi - vo) / RS, iz: iz(vo, rev), il: R ? vo / R : 0 };
}
const dropout = li => (LOADS[li].R ? VZ + (VZ / LOADS[li].R) * RS : VZ);

// ---------- canvas ----------
const W = 1400, H = 760;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
function fit() {
  const st = document.getElementById("stage");
  const s = Math.min(st.clientWidth / W, st.clientHeight / H), dpr = window.devicePixelRatio || 1;
  cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
  cv.width = W * s * dpr; cv.height = H * s * dpr; ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
window.addEventListener("resize", fit);

const INK = "#1a2233", MUTED = "#5b6478", GRID = "#e1e5ec", WIRE = "#4a5468", OFFC = "#b8bfcc";
const CS = "#1f6fd6", CZ = "#8a3ffc", CL = "#18a058", GOOD = "#18a058", BAD = "#d93636";

function text(t, x, y, size, color, align = "center", weight = "normal") {
  ctx.fillStyle = color; ctx.font = `${weight} ${size}px Segoe UI, Arial`;
  ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillText(t, x, y);
}
function sub(main, s, x, y, size, color, align = "left", weight = "bold") {
  ctx.font = `${weight} ${size}px Segoe UI, Arial`; const w1 = ctx.measureText(main).width;
  ctx.font = `${weight} ${size * 0.62}px Segoe UI, Arial`; const w2 = ctx.measureText(s).width;
  const x0 = align === "center" ? x - (w1 + w2) / 2 : align === "right" ? x - w1 - w2 : x;
  ctx.fillStyle = color; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.font = `${weight} ${size}px Segoe UI, Arial`; ctx.fillText(main, x0, y);
  ctx.font = `${weight} ${size * 0.62}px Segoe UI, Arial`; ctx.fillText(s, x0 + w1 + 1, y + size * 0.3);
  return x0 + w1 + w2 + 2;
}
function poly(pts, color, w = 4) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.stroke();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function box(x, y, w, h, fill = "#fff", stroke = "#dfe3ea") {
  roundRect(x, y, w, h, 12); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke();
}
function tag(label, x, y, bg, fg = "#fff") {
  ctx.font = "bold 17px Segoe UI, Arial"; const w = ctx.measureText(label).width + 20;
  roundRect(x - w / 2, y - 15, w, 30, 8); ctx.fillStyle = bg; ctx.fill();
  text(label, x, y + 1, 17, fg, "center", "bold");
}
const f2 = v => v.toFixed(2), f1 = v => v.toFixed(1);
const mA = i => (i * 1000).toFixed(1) + " mA";

// ---------- circuit geometry ----------
const SX = 110, SY = 295, TOPY = 150, BOTY = 440, RS0 = 210, RS1 = 350, NX = 450, LX = 620;
function zigH(x0, x1, y, color) {
  const n = 6, d = (x1 - x0) / n, pts = [[x0, y]];
  for (let k = 0; k < n; k++) pts.push([x0 + d * (k + 0.5), y + (k % 2 ? 14 : -14)]);
  pts.push([x1, y]); poly(pts, color);
}
function zigV(x, y0, y1, color) {
  const n = 6, d = (y1 - y0) / n, pts = [[x, y0]];
  for (let k = 0; k < n; k++) pts.push([x + (k % 2 ? -14 : 14), y0 + d * (k + 0.5)]);
  pts.push([x, y1]); poly(pts, color);
}
function ground(x, y) {
  poly([[x, y], [x, y + 14]], WIRE);
  for (let k = 0; k < 3; k++) poly([[x - 22 + k * 7, y + 14 + k * 8], [x + 22 - k * 7, y + 14 + k * 8]], WIRE, 3.5);
}
function heatCol(t) {
  const u = Math.max(0, Math.min(1, (t - 40) / (TBURN - 40)));
  return `rgb(${Math.round(138 + 117 * u)},${Math.round(63 + 40 * u - 63 * u * u)},${Math.round(252 - 252 * u)})`;
}
function zener(x, yc, on, rev) {
  let c = on ? CZ : WIRE;
  if (burnt) {
    c = "#2a2a2a";
    ctx.fillStyle = "#55555533"; ctx.beginPath(); ctx.arc(x, yc, 52, 0, 7); ctx.fill();
  } else if (temp > 45) {
    c = heatCol(temp);
    const g = ctx.createRadialGradient(x, yc, 5, x, yc, 70);
    g.addColorStop(0, `rgba(255,80,0,${Math.min(0.55, (temp - 45) / 250)})`); g.addColorStop(1, "rgba(255,80,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, yc, 70, 0, 7); ctx.fill();
  } else if (on) { ctx.fillStyle = CZ + "22"; ctx.beginPath(); ctx.arc(x, yc, 50, 0, 7); ctx.fill(); }
  // rev = false: cathode on top (correct, reverse biased). Triangle points to the cathode.
  const tipY = rev ? yc + 18 : yc - 18, baseY = rev ? yc - 18 : yc + 18;
  poly([[x, TOPY], [x, rev ? baseY : tipY]], c); poly([[x, rev ? tipY : baseY], [x, BOTY]], c);
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x - 22, baseY); ctx.lineTo(x + 22, baseY); ctx.lineTo(x, tipY); ctx.closePath(); ctx.fill();
  poly([[x - 30, tipY + (rev ? -8 : 8)], [x - 22, tipY], [x + 22, tipY], [x + 30, tipY + (rev ? 8 : -8)]], c, 5);
  if (burnt) { poly([[x - 16, yc - 14], [x + 4, yc + 2], [x - 6, yc + 6], [x + 16, yc + 18]], "#f2b84b", 3); }
}
function drawSmoke(dt) {
  if (!burnt && temp > 140 && Math.random() < dt * (temp - 120) / 12) smoke.push({ x: NX + (Math.random() - 0.5) * 20, y: 285, r: 8, a: 0.55 });
  if (burnt && Math.random() < dt * 3) smoke.push({ x: NX + (Math.random() - 0.5) * 16, y: 285, r: 8, a: 0.4 });
  for (const p of smoke) { p.y -= 40 * dt; p.x += 12 * dt * Math.sin(p.y / 15); p.r += 14 * dt; p.a -= 0.22 * dt; }
  smoke = smoke.filter(p => p.a > 0);
  for (const p of smoke) { ctx.fillStyle = `rgba(90,90,95,${p.a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
}

// ---------- current dots ----------
function mkPath(pts) {
  let L = 0; const seg = [];
  for (let k = 1; k < pts.length; k++) {
    const l = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); seg.push(l); L += l;
  }
  return { pts, seg, L, ph: 0 };
}
function at(p, s) {
  s = ((s % p.L) + p.L) % p.L;
  for (let k = 0; k < p.seg.length; k++) {
    if (s <= p.seg[k]) { const a = p.pts[k], b = p.pts[k + 1], u = s / p.seg[k]; return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]; }
    s -= p.seg[k];
  }
  return p.pts[p.pts.length - 1];
}
const PS = mkPath([[SX, SY - 42], [SX, TOPY], [NX, TOPY]]);
const PZ = mkPath([[NX, TOPY], [NX, BOTY]]);
const PL = mkPath([[NX, TOPY], [LX, TOPY], [LX, BOTY], [NX, BOTY]]);
const PR = mkPath([[NX, BOTY], [SX, BOTY], [SX, SY + 42]]);
const GAP = 30, K = 7;   // px between dots, px/s per mA
function dots(p, i, color) {
  if (i * 1000 < 0.05) return;
  ctx.fillStyle = color;
  for (let s = 0; s < p.L; s += GAP) {
    const q = at(p, s + (p.ph % GAP)); ctx.beginPath(); ctx.arc(q[0], q[1], 5, 0, 7); ctx.fill();
  }
}

function drawCircuit(r) {
  text("P3  Zener Regulator", 40, 40, 28, INK, "left", "bold");
  text("A Zener in reverse breakdown holds V₀ᵤₜ steady while Vᵢₙ or the load changes", 40, 74, 16, MUTED, "left");
  const zOn = r.iz > 0.001;
  // wires
  poly([[SX, SY - 42], [SX, TOPY], [RS0, TOPY]], WIRE); poly([[RS1, TOPY], [LX, TOPY], [LX, 190]], WIRE);
  poly([[LX, 250], [LX, 290]], WIRE); poly([[LX, 380], [LX, BOTY], [SX, BOTY], [SX, SY + 42]], WIRE);
  const prs = r.is * r.is * RS, rsHot = prs > 0.25;
  if (rsHot) { ctx.fillStyle = "rgba(255,90,0,0.18)"; roundRect(RS0 - 6, TOPY - 26, RS1 - RS0 + 12, 52, 10); ctx.fill(); }
  zigH(RS0, RS1, TOPY, rsHot ? "#e05a00" : WIRE);
  zener(NX, 295, zOn, fault);
  zigV(LX, 290, 380, load ? WIRE : OFFC);
  // switch S1
  ctx.fillStyle = "#fff"; ctx.strokeStyle = WIRE; ctx.lineWidth = 3.5;
  for (const y of [190, 250]) { ctx.beginPath(); ctx.arc(LX, y, 8, 0, 7); ctx.fill(); ctx.stroke(); }
  if (load) poly([[LX, 198], [LX, 242]], WIRE, 5); else poly([[LX + 5, 197], [LX + 42, 246]], WIRE, 5);
  text("S1", LX + 28, 220, 17, MUTED, "left", "bold");
  // source
  ctx.fillStyle = "#fff"; ctx.strokeStyle = WIRE; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(SX, SY, 42, 0, 7); ctx.fill(); ctx.stroke();
  text("+", SX, SY - 18, 26, INK, "center", "bold"); text("−", SX, SY + 18, 26, INK, "center", "bold");
  ground(280, BOTY);
  // dots
  dots(PS, r.is, CS); dots(PR, r.is, CS); dots(PZ, r.iz, CZ); if (load) dots(PL, r.il, CL);
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(NX, TOPY, 8, 0, 7); ctx.fill();
  // labels
  sub("R", "S", 248, 108, 19, RS < 330 ? BAD : INK, "left"); text(RS + " Ω", 274, 108, 18, RS < 330 ? BAD : INK, "left", RS < 330 ? "bold" : "normal");
  if (rsHot) text("Rₛ " + prs.toFixed(1) + " W: too hot for a ¼ W resistor", 280, 218, 14, "#e05a00", "center", "bold");
  tag("V(Rₛ) = " + f2(vin - r.vo) + " V", 280, 186, "#e9edf4", INK);
  tag("Vᵢₙ " + f1(vin) + " V", SX, 112, CS);
  tag("Vₒᵤₜ " + f2(r.vo) + " V", NX + 20, 112, GOOD);
  text("5.1 V Zener", NX - 44, 272, 17, INK, "right", "bold");
  const zs = burnt ? ["BURNT: failed short", BAD] : fault ? ["fitted backwards", BAD] : temp > 120 ? ["OVERHEATING " + temp.toFixed(0) + " °C", "#e05a00"] : zOn ? ["in breakdown", CZ] : ["not conducting", MUTED];
  text(zs[0], NX - 44, 296, 15, zs[1], "right", "bold");
  text(mA(r.iz), NX - 44, 324, 17, CZ, "right", "bold"); ctx.font = "bold 17px Segoe UI, Arial"; sub("I", "Z", NX - 50 - ctx.measureText(mA(r.iz)).width, 324, 18, CZ, "right");
  sub("R", "L", LX + 26, 322, 19, load ? INK : MUTED); text(load ? LOADS[load].name : "open", LX + 26, 348, 16, load ? INK : MUTED, "left", load ? "bold" : "normal");
  if (load) { sub("I", "L", LX + 26, 374, 18, CL); text(mA(r.il), LX + 48, 374, 17, CL, "left", "bold"); }
  sub("I", "S", 170, 418, 18, CS); text(mA(r.is), 192, 418, 17, CS, "left", "bold");
  text("0 V", 330, 470, 15, MUTED, "left");
}

function drawPanel(r) {
  const x = 40, y = 494, w = 680, h = 250;
  box(x, y, w, h);
  // status
  let msg, col;
  if (burnt) { msg = "BURNT: the Zener failed short, Vₒᵤₜ is about 0 V. Press Replace Zener."; col = BAD; }
  else if (r.vo * r.iz > PMAX) { msg = "DANGER: Pz = " + (r.vo * r.iz).toFixed(2) + " W, rating 1 W. The Zener is heating up, it will burn."; col = "#e05a00"; }
  else if (fault) { msg = "Zener backwards: it conducts like a normal diode, Vₒᵤₜ sticks near 0.7 V."; col = BAD; }
  else if (r.iz > 0.001) { msg = "REGULATING: the Zener takes the spare current, so Vₒᵤₜ stays near 5.1 V."; col = GOOD; }
  else if (vin < 0.05) { msg = "Turn up Vᵢₙ."; col = MUTED; }
  else if (load) { msg = "NOT regulating: Vᵢₙ too low for this load. Zener is off, Rs and RL just divide."; col = BAD; }
  else { msg = "NOT regulating: Vᵢₙ below 5.1 V. Zener is off, Vₒᵤₜ follows Vᵢₙ."; col = BAD; }
  roundRect(x + 14, y + 12, w - 28, 38, 8); ctx.fillStyle = col + "18"; ctx.fill();
  text(msg, x + 28, y + 32, 17, col, "left", "bold");
  // readings grid
  const cells = [
    ["V", "in", f2(vin) + " V", CS], ["V", "RS", f2(vin - r.vo) + " V", INK], ["V", "out", f2(r.vo) + " V", GOOD],
    ["I", "S", mA(r.is), CS], ["I", "Z", mA(r.iz), CZ], ["I", "L", mA(r.il), CL],
    ["P", "Z", (r.vo * r.iz * 1000).toFixed(0) + " mW", r.vo * r.iz > PMAX ? BAD : INK], ["P", "RS", (r.is * r.is * RS * 1000).toFixed(0) + " mW", INK],
    ["T", "Z", temp.toFixed(0) + " °C", burnt ? BAD : temp > 120 ? "#e05a00" : INK],
  ];
  cells.forEach((c, k) => {
    const cx = x + 28 + (k % 3) * 220, cy = y + 80 + Math.floor(k / 3) * 38;
    const e = sub(c[0], c[1], cx, cy, 18, MUTED, "left", "normal");
    text(c[2], e + 10, cy, 20, c[3], "left", "bold");
  });
  // current split bar
  const full = RS < 330 ? 0.6 : 0.025, tick = RS < 330 ? 100 : 5;
  const bx = x + 28, by = y + 196, bw = w - 56, bh = 20, sc = bw / full;
  ctx.fillStyle = "#eef1f6"; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = CZ; ctx.fillRect(bx, by, Math.min(r.iz, full) * sc, bh);
  ctx.fillStyle = CL; ctx.fillRect(bx + r.iz * sc, by, Math.max(0, Math.min(r.il, full - r.iz)) * sc, bh);
  ctx.strokeStyle = CS; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bx + Math.min(r.is, full) * sc, by - 6); ctx.lineTo(bx + Math.min(r.is, full) * sc, by + bh + 6); ctx.stroke();
  for (let m = 0; m <= full * 1000 + 0.1; m += tick) text(m + "", bx + m / 1000 * sc, by + bh + 14, 12, MUTED);
  let e = sub("I", "S", bx, by - 14, 16, CS, "left"); e = text("=", e + 6, by - 14, 16, INK, "left");
  ctx.font = "16px Segoe UI, Arial";
  const t1 = ` ${(r.is * 1000).toFixed(1)} = `, xx = bx + 24 + ctx.measureText("=").width;
  text(t1, xx, by - 14, 16, INK, "left", "bold");
  let x2 = xx + ctx.measureText(t1).width + 6;
  x2 = sub("I", "Z", x2, by - 14, 16, CZ, "left"); text(` ${(r.iz * 1000).toFixed(1)}  +`, x2, by - 14, 16, CZ, "left", "bold");
  ctx.font = "bold 16px Segoe UI, Arial"; x2 += ctx.measureText(` ${(r.iz * 1000).toFixed(1)}  +`).width + 8;
  x2 = sub("I", "L", x2, by - 14, 16, CL, "left"); text(` ${(r.il * 1000).toFixed(1)} mA`, x2, by - 14, 16, CL, "left", "bold");
  text("mA", bx + bw, by - 14, 13, MUTED, "right");
}

// ---------- graph: Zener characteristic, reverse bias part only ----------
// Origin top right. Reverse voltage grows to the left, reverse current grows downward.
const GX0 = 830, GX1 = 1330, GY0 = 96, GY1 = 410, VRMAX = 7;
const gx = v => GX1 - (v / VRMAX) * (GX1 - GX0);
let IMAX = 0.03;
const gy = i => GY0 + (i / IMAX) * (GY1 - GY0);
let recs = [];
function drawGraph(r) {
  IMAX = RS < 330 ? 0.3 : 0.03;
  const step = RS < 330 ? 0.05 : 0.005;
  box(740, 24, 630, 440);
  text("Zener characteristic (reverse bias)", 760, 50, 20, INK, "left", "bold");
  // grid
  ctx.strokeStyle = GRID; ctx.lineWidth = 1;
  for (let v = 0; v <= VRMAX; v++) { ctx.beginPath(); ctx.moveTo(gx(v), GY0); ctx.lineTo(gx(v), GY1); ctx.stroke(); }
  for (let i = 0; i <= IMAX + 1e-9; i += step) { ctx.beginPath(); ctx.moveTo(GX0, gy(i)); ctx.lineTo(GX1, gy(i)); ctx.stroke(); }
  // axes through the origin (top right)
  poly([[GX0 - 10, GY0], [GX1 + 14, GY0]], INK, 2.5); poly([[GX1, GY0 - 14], [GX1, GY1 + 10]], INK, 2.5);
  for (let v = 1; v <= VRMAX; v++) text("−" + v, gx(v), GY0 - 14, 13, MUTED);
  text("0", GX1 + 12, GY0 - 14, 13, MUTED);
  for (let i = step; i <= IMAX + 1e-9; i += step) text("−" + Math.round(i * 1000), GX1 + 10, gy(i), 13, MUTED, "left");
  text("−V (V)", GX0 - 8, GY0 + 16, 14, MUTED, "left");
  text("−I (mA)", GX1 + 10, GY1 + 26, 14, MUTED, "left");
  // V_Z line and knee note
  ctx.setLineDash([7, 6]); ctx.strokeStyle = CZ; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(gx(VZ), GY0); ctx.lineTo(gx(VZ), GY1); ctx.stroke();
  // 1 W limit: I_ZM = P / V_Z
  const izm = PMAX / VZ;
  if (izm < IMAX) {
    ctx.strokeStyle = BAD; ctx.beginPath(); ctx.moveTo(GX0, gy(izm)); ctx.lineTo(GX1, gy(izm)); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.font = "bold 14px Segoe UI, Arial"; const wz = ctx.measureText("5.1 V").width;
  ctx.fillStyle = "#fff"; ctx.fillRect(gx(VZ) - 40 - wz, gy(IMAX * 0.55) - 12, wz + 34, 26);
  sub("V", "Z", gx(VZ) - 14 - wz, gy(IMAX * 0.55), 16, CZ, "right"); text("5.1 V", gx(VZ) - 10, gy(IMAX * 0.55), 14, CZ, "right", "bold");
  if (izm < IMAX) { ctx.fillStyle = "rgba(217,54,54,0.07)"; ctx.fillRect(GX0, gy(izm), GX1 - GX0, GY1 - gy(izm));
    const e = sub("I", "ZM", gx(VZ) + 22, gy(izm) + 16, 15, BAD, "left");
    text(" " + Math.round(izm * 1000) + " mA: 1 W limit, more burns it", e, gy(izm) + 16, 14, BAD, "left", "bold"); }
  // curve
  const pts = [];
  for (let v = 0; v <= 5.6; v += 0.01) { const i = iz0(v); if (i > IMAX) break; pts.push([gx(v), gy(i)]); }
  poly(pts, burnt ? OFFC : CZ, 4);
  text("leakage: almost no current", gx(2.6), GY0 + 22, 14, MUTED, "center");
  const ay = gy(IMAX * 0.38);
  text("breakdown: V stays near 5.1 V", gx(VZ) + 22, ay, 14, CZ, "left", "bold");
  text("while I changes a lot", gx(VZ) + 22, ay + 18, 14, CZ, "left");
  if (burnt) {
    const sp = []; for (let v = 0; v <= 7; v += 0.05) { const i = v / 0.5; if (i > IMAX) break; sp.push([gx(v), gy(i)]); }
    poly(sp.length > 1 ? sp : [[gx(0), gy(0)], [gx(IMAX * 0.5), gy(IMAX)]], "#2a2a2a", 4);
    text("burnt: short, no 5.1 V knee", gx(0.25), gy(IMAX * 0.25), 14, BAD, "right", "bold");
  }
  // recorded points
  for (const p of recs) {
    if (p.iz > IMAX || p.f) continue;
    ctx.fillStyle = "#fff"; ctx.strokeStyle = LOADS[p.l].col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(gx(p.o), gy(p.iz), 6, 0, 7); ctx.fill(); ctx.stroke();
  }
  // operating point
  if (fault) {
    roundRect(GX0 + 40, GY0 + 110, 380, 64, 10); ctx.fillStyle = "#fde2e2"; ctx.fill();
    text("Zener fitted backwards: it is forward biased,", GX0 + 230, GY0 + 130, 15, BAD, "center", "bold");
    text("so it works off this chart at about 0.7 V", GX0 + 230, GY0 + 154, 15, BAD, "center", "bold");
  } else {
    const px = gx(r.vo), py = gy(Math.min(r.iz, IMAX));
    ctx.setLineDash([4, 4]); ctx.strokeStyle = MUTED; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px, GY0); ctx.lineTo(px, py); ctx.lineTo(GX1, py); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = burnt ? "#2a2a2a" : LOADS[load].col; ctx.beginPath(); ctx.arc(px, py, 9, 0, 7); ctx.fill();
    const tx = Math.max(GX0 + 90, Math.min(GX1 - 110, px - 110)), ty = py + 34 > GY1 - 10 ? py - 30 : py + 34;
    tag(f2(r.vo) + " V, " + mA(r.iz), tx, ty, burnt ? "#2a2a2a" : LOADS[load].col);
  }
}

// ---------- table (matches the worksheet) ----------
const COLS = [2, 4, 5, 6, 7, 8, 9, 10, 12];
let table = [{}, {}, {}];
function drawTable() {
  const x = 740, y = 480, w = 630, c0 = 150, cw = (w - c0) / COLS.length, rh = 36;
  box(x, y, w, 264);
  sub("V", "in", x + 16, y + 24, 16, INK, "left"); text("(V)", x + 48, y + 24, 15, INK, "left", "bold");
  COLS.forEach((v, k) => {
    const cx = x + c0 + cw * (k + 0.5), hit = Math.abs(vin - v) < 0.05;
    if (hit) { ctx.fillStyle = "#1f6fd61a"; ctx.fillRect(cx - cw / 2, y + 6, cw, rh * 4 - 6); }
    text(v + "", cx, y + 24, 16, hit ? CS : INK, "center", "bold");
  });
  for (let li = 0; li < 3; li++) {
    const ry = y + 24 + rh * (li + 1);
    ctx.strokeStyle = GRID; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + 10, ry - rh / 2); ctx.lineTo(x + w - 10, ry - rh / 2); ctx.stroke();
    if (li === load) { ctx.fillStyle = LOADS[li].col + "14"; ctx.fillRect(x + 6, ry - rh / 2, w - 12, rh); }
    text(LOADS[li].name, x + 16, ry, 15, LOADS[li].col, "left", "bold");
    COLS.forEach((v, k) => { const val = table[li][v]; if (val !== undefined) text(f2(val), x + c0 + cw * (k + 0.5), ry, 15, INK); });
  }
  text("Set Vᵢₙ to a column value and press Record. Sweep fills the row for the load in use.", x + 16, y + 186, 14, MUTED, "left");
  let xx = sub("V", "in", x + 16, y + 222, 16, INK, "left");
  if (RS === 330) text("must be above  Vz + (Vz / RL) × Rs  :  1 kΩ → 6.8 V,  470 Ω → 8.7 V", xx + 6, y + 222, 15, INK, "left");
  else text("must be above  Vz + (Vz / RL) × Rs ,  but a small Rₛ lets far too much current through", xx + 6, y + 222, 15, BAD, "left");
}

// ---------- loop ----------
let last = performance.now(), sweeping = false;
function record() {
  const r = solve(vin, load, fault);
  recs.push({ v: vin, o: r.vo, iz: r.iz, l: load, f: fault || burnt });
  for (const c of COLS) if (Math.abs(vin - c) < 0.05) table[load][c] = r.vo;
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (sweeping) {
    const prev = vin; vin = Math.min(12, vin + 1.5 * dt);
    for (const c of COLS) if (prev < c && vin >= c) { const v0 = vin; vin = c; record(); vin = v0; }
    if (vin >= 12) { sweeping = false; document.getElementById("swp").classList.remove("on"); }
    syncSlider();
  }
  const r = solve(vin, load, fault);
  const sp = i => Math.min(i * 1000 * K, 420) * dt;
  PS.ph += sp(r.is); PR.ph += sp(r.is); PZ.ph += sp(r.iz); PL.ph += sp(r.il);
  // Zener temperature: heads toward 25 + P_Z x 150 C/W (time sped up)
  const pz = r.vo * r.iz;
  if (!burnt) { temp += (25 + pz * THETA - temp) * Math.min(1, dt / 1.2); if (temp >= TBURN) { burnt = true; temp = TBURN; } }
  else temp += (25 - temp) * Math.min(1, dt / 4);
  ctx.fillStyle = "#f6f7fb"; ctx.fillRect(0, 0, W, H);
  drawCircuit(r); drawSmoke(dt); drawPanel(r); drawGraph(r); drawTable();
  requestAnimationFrame(frame);
}

// ---------- controls ----------
const sl = document.getElementById("vin"), vv = document.getElementById("vinv");
function syncSlider() { sl.value = vin; vv.textContent = f1(vin) + " V"; }
sl.addEventListener("input", () => { vin = +sl.value; sweeping = false; document.getElementById("swp").classList.remove("on"); syncSlider(); });
function setLoad(li) {
  load = li; ["l0", "l1", "l2"].forEach((id, k) => document.getElementById(id).classList.toggle("on", k === li));
}
["l0", "l1", "l2"].forEach((id, k) => document.getElementById(id).addEventListener("click", () => setLoad(k)));
document.getElementById("rec").addEventListener("click", record);
function sweep() { vin = 0; sweeping = true; document.getElementById("swp").classList.add("on"); }
document.getElementById("swp").addEventListener("click", sweep);
document.getElementById("flt").addEventListener("click", e => { fault = !fault; e.target.classList.toggle("warn", fault); });
document.getElementById("rs").addEventListener("click", e => {
  RS = RS === 330 ? 22 : 330; e.target.classList.toggle("warn", RS !== 330);
});
document.getElementById("rep").addEventListener("click", () => { burnt = false; temp = 25; smoke = []; });
document.getElementById("clr").addEventListener("click", () => { recs = []; table = [{}, {}, {}]; });
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) e.preventDefault();
  const st = e.shiftKey ? 1 : 0.1;
  if (e.key === "ArrowRight") { vin = Math.min(12, Math.round((vin + st) * 10) / 10); syncSlider(); }
  else if (e.key === "ArrowLeft") { vin = Math.max(0, Math.round((vin - st) * 10) / 10); syncSlider(); }
  else if (e.key === "1" || e.key === "2" || e.key === "3") setLoad(+e.key - 1);
  else if (e.key === "r" || e.key === "R") record();
  else if (e.key === "s" || e.key === "S") sweep();
  else if (e.key === "f" || e.key === "F") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
});
fit(); syncSlider(); requestAnimationFrame(frame);
</script>
