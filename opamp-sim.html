<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How an Op-Amp Works</title>
<style>
  :root { --bg:#f6f7fb; --panel:#ffffff; --ink:#1a2233; --muted:#5b6478; --accent:#1f6fd6; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI", Roboto, Arial, sans-serif; overflow:hidden; }
  #wrap { position:absolute; inset:0; display:flex; flex-direction:column; }
  #stage { flex:1; position:relative; }
  canvas { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); touch-action:none; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:7px 16px;
    background:var(--panel); border-top:1px solid #dfe3ea; font-size:15px; }
  .row label { color:var(--muted); }
  .val { min-width:70px; font-weight:bold; }
  input[type=range] { width:170px; accent-color:var(--accent); }
  button { background:#eef1f6; color:var(--ink); border:1px solid #cfd5e0; border-radius:6px;
    padding:6px 11px; font-size:14px; cursor:pointer; }
  button:hover { background:#e2e7f0; }
  button.on { background:#dbe9fb; border-color:#1f6fd6; font-weight:bold; }
  button.warn { background:#fde2e2; border-color:#d93636; }
  .sp { flex:1; }
  .keys { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c"></canvas></div>
  <div class="row" id="tabs"></div>
  <div class="row" id="ctl"></div>
</div>
<script>
"use strict";
// ======================================================================
// Model constants: 741 on +/-9 V supplies
// ======================================================================
const AOL = 200000, VSAT = 7.5, FV = 0.5;          // FV: on-screen signal frequency (slowed down)
const clip = v => Math.max(-VSAT, Math.min(VSAT, v));
const sin = Math.sin, TAU = 2 * Math.PI;

// ======================================================================
// Canvas
// ======================================================================
const W = 1400, H = 760;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let scaleS = 1;
function fit() {
  const st = document.getElementById("stage");
  const s = Math.min(st.clientWidth / W, st.clientHeight / H), dpr = window.devicePixelRatio || 1;
  scaleS = s;
  cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
  cv.width = W * s * dpr; cv.height = H * s * dpr; ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
window.addEventListener("resize", fit);

const INK = "#1a2233", MUTED = "#5b6478", GRID = "#e1e5ec", WIRE = "#4a5468", OFFC = "#b8bfcc";
const CIN = "#e07a00", COUT = "#1f6fd6", CM = "#8a3ffc", GOOD = "#18a058", BAD = "#d93636", FB = "#c2185b";

// ---------- text with subscripts: "V_{out}" or "V_d"
function font(size, weight) { return `${weight} ${size}px Segoe UI, Arial`; }
function parseRich(str) {
  const out = []; const rx = /_\{([^}]*)\}|_([A-Za-z0-9+\-−])/g; let pos = 0, m;
  while ((m = rx.exec(str))) {
    if (m.index > pos) out.push({ t: str.slice(pos, m.index), s: false });
    out.push({ t: m[1] !== undefined ? m[1] : m[2], s: true }); pos = rx.lastIndex;
  }
  if (pos < str.length) out.push({ t: str.slice(pos), s: false });
  return out;
}
function richWidth(str, size, weight = "normal") {
  let w = 0;
  for (const p of parseRich(str)) { ctx.font = font(p.s ? size * 0.66 : size, weight); w += ctx.measureText(p.t).width; }
  return w;
}
function text(str, x, y, size = 16, color = INK, align = "left", weight = "normal") {
  const segs = parseRich(String(str)), w = richWidth(String(str), size, weight);
  let cx = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  ctx.fillStyle = color; ctx.textBaseline = "middle"; ctx.textAlign = "left";
  for (const p of segs) {
    ctx.font = font(p.s ? size * 0.66 : size, weight);
    ctx.fillText(p.t, cx, p.s ? y + size * 0.3 : y); cx += ctx.measureText(p.t).width;
  }
  return cx;
}
function poly(pts, color = WIRE, w = 3.5, dash) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.setLineDash(dash || []);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.stroke();
  ctx.setLineDash([]);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function box(x, y, w, h, fill = "#fff", stroke = "#dfe3ea") {
  roundRect(x, y, w, h, 12); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke();
}
function tag(label, x, y, bg, align = "center", fg = "#fff") {
  const w = richWidth(label, 16, "bold") + 18;
  const x0 = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  roundRect(x0, y - 14, w, 28, 7); ctx.fillStyle = bg; ctx.fill();
  text(label, x0 + 9, y + 1, 16, fg, "left", "bold");
}
function dot(x, y, r = 6, c = INK) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function terminal(x, y) { ctx.fillStyle = "#fff"; ctx.strokeStyle = WIRE; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.fill(); ctx.stroke(); }

// ---------- components
function zigH(x0, x1, y, color = WIRE) {
  const n = 6, d = (x1 - x0) / n, pts = [[x0, y]];
  for (let k = 0; k < n; k++) pts.push([x0 + d * (k + 0.5), y + (k % 2 ? 12 : -12)]);
  pts.push([x1, y]); poly(pts, color);
}
function zigV(x, y0, y1, color = WIRE) {
  const n = 6, d = (y1 - y0) / n, pts = [[x, y0]];
  for (let k = 0; k < n; k++) pts.push([x + (k % 2 ? -12 : 12), y0 + d * (k + 0.5)]);
  pts.push([x, y1]); poly(pts, color);
}
function ground(x, y) {
  poly([[x, y], [x, y + 12]]);
  for (let k = 0; k < 3; k++) poly([[x - 18 + k * 6, y + 12 + k * 7], [x + 18 - k * 6, y + 12 + k * 7]], WIRE, 3);
}
function generator(x, y, r = 26, color = CIN) {
  ctx.fillStyle = "#fff"; ctx.strokeStyle = color; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  for (let k = 0; k <= 30; k++) { const xx = x - r * 0.6 + k * r * 1.2 / 30, yy = y - r * 0.35 * sin(k / 30 * TAU); k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
  ctx.stroke();
}
// Op-amp triangle. Returns the ends of the input leads and the output tip.
function opamp(cx, cy, o = {}) {
  const w = o.w || 110, h = o.h || 120, x0 = cx - w / 2, x1 = cx + w / 2;
  const yTop = cy - h / 4, yBot = cy + h / 4;
  if (!o.noSupply) {
    poly([[cx, cy - h / 4], [cx, cy - h / 4 - 24]]); text(o.vp || "+9 V", cx, cy - h / 4 - 36, 14, MUTED, "center");
    poly([[cx, cy + h / 4], [cx, cy + h / 4 + 24]]); text(o.vn || "−9 V", cx, cy + h / 4 + 36, 14, MUTED, "center");
  }
  poly([[x0 - 24, yTop], [x0, yTop]]); poly([[x0 - 24, yBot], [x0, yBot]]);
  ctx.fillStyle = "#fff"; ctx.strokeStyle = o.color || INK; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(x0, cy - h / 2); ctx.lineTo(x1, cy); ctx.lineTo(x0, cy + h / 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  const top = o.plusTop ? "+" : "−", bot = o.plusTop ? "−" : "+";
  text(top, x0 + 14, yTop, 24, INK, "center", "bold"); text(bot, x0 + 14, yBot, 24, INK, "center", "bold");
  if (o.name !== "") text(o.name || "741", x0 + 44, cy, 15, MUTED, "center", "bold");
  const tp = [x0 - 24, yTop], bp = [x0 - 24, yBot];
  return { minus: o.plusTop ? bp : tp, plus: o.plusTop ? tp : bp, out: [x1, cy] };
}

// ---------- moving charge dots along a path (conventional current)
function mkPath(pts) {
  let L = 0; const seg = [];
  for (let k = 1; k < pts.length; k++) { const l = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); seg.push(l); L += l; }
  return { pts, seg, L, ph: 0 };
}
function at(p, s) {
  s = Math.max(0, Math.min(p.L, s));
  for (let k = 0; k < p.seg.length; k++) {
    if (s <= p.seg[k]) { const a = p.pts[k], b = p.pts[k + 1], u = p.seg[k] ? s / p.seg[k] : 0; return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]; }
    s -= p.seg[k];
  }
  return p.pts[p.pts.length - 1];
}
const GAP = 28;
function flow(p, mA, color, dt) {
  p.ph += Math.max(-260, Math.min(260, mA * 70)) * dt;
  if (Math.abs(mA) < 0.004) return;
  ctx.fillStyle = color; const off = ((p.ph % GAP) + GAP) % GAP;
  for (let s = off; s < p.L; s += GAP) { const q = at(p, s); ctx.beginPath(); ctx.arc(q[0], q[1], 4.5, 0, TAU); ctx.fill(); }
}

// ---------- scope: rolling traces over the last WIN seconds
const WIN = 4;
function scope(x, y, w, h, o) {
  box(x, y, w, h);
  text(o.title, x + 16, y + 24, 18, INK, "left", "bold");
  const gx = x + 14, gy = y + 46, gw = w - 28, gh = h - 82, nx = 10, ny = 8, vdiv = o.vdiv || 2;
  ctx.fillStyle = "#fbfcfe"; ctx.fillRect(gx, gy, gw, gh);
  ctx.strokeStyle = GRID; ctx.lineWidth = 1;
  for (let i = 0; i <= nx; i++) { ctx.beginPath(); ctx.moveTo(gx + gw * i / nx, gy); ctx.lineTo(gx + gw * i / nx, gy + gh); ctx.stroke(); }
  for (let j = 0; j <= ny; j++) { ctx.beginPath(); ctx.moveTo(gx, gy + gh * j / ny); ctx.lineTo(gx + gw, gy + gh * j / ny); ctx.stroke(); }
  ctx.strokeStyle = "#c5ccd8"; ctx.beginPath(); ctx.moveTo(gx, gy + gh / 2); ctx.lineTo(gx + gw, gy + gh / 2); ctx.stroke();
  const cy = gy + gh / 2, k = (gh / ny) / vdiv;
  if (o.rails) for (const r of [VSAT, -VSAT]) poly([[gx, cy - r * k], [gx + gw, cy - r * k]], BAD + "88", 1.5, [6, 5]);
  ctx.save(); ctx.beginPath(); ctx.rect(gx, gy, gw, gh); ctx.clip();
  for (const tr of o.traces) {
    ctx.strokeStyle = tr.color; ctx.lineWidth = tr.width || 3; ctx.setLineDash(tr.dash || []);
    ctx.beginPath();
    for (let px = 0; px <= gw; px += 2) {
      const tau = t - WIN + WIN * px / gw, v = tr.f(tau), py = cy - v * k;
      px ? ctx.lineTo(gx + px, py) : ctx.moveTo(gx + px, py);
    }
    ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
  // legend + scale
  let lx = gx;
  for (const tr of o.traces) {
    if (!tr.label) continue;
    poly([[lx, gy + gh + 20], [lx + 22, gy + gh + 20]], tr.color, 4, tr.dash);
    lx = text(tr.label, lx + 28, gy + gh + 20, 15, INK, "left", "bold") + 18;
  }
  text(vdiv + " V/div", gx + gw, gy + gh + 20, 13, MUTED, "right");
}
function readout(lines, x = 30, y = 610, w = 730, h = 130) {
  box(x, y, w, h);
  let yy = y + 30;
  for (const L of lines) {
    if (L.pill) { roundRect(x + 14, yy - 20, w - 28, 40, 8); ctx.fillStyle = L.color + "18"; ctx.fill(); }
    text(L.s, x + (L.pill ? 28 : 22), yy, L.size || 22, L.color || INK, "left", L.weight || "normal");
    yy += L.gap || 52;
  }
}
function header(title, subtitle) {
  text(title, 40, 36, 28, INK, "left", "bold");
}

// ======================================================================
// Scenes
// ======================================================================
const SCENES = [
  { key: "loop", name: "1 Open and closed loop" },
  { key: "inv", name: "2 Inverting" },
  { key: "non", name: "3 Non inverting" },
  { key: "gain", name: "4 Gain control" },
  { key: "anc", name: "5 Noise cancelling" },
  { key: "diff", name: "6 Noisy cable" },
];
let scene = 0, t = 0, paused = false, lastDt = 0;

// ---------- shared resistor value list (kOhm)
const EVALS = [1, 2.2, 4.7, 10, 22, 47, 100, 220, 470];
const kfmt = v => (v >= 1000 ? v / 1000 + " MΩ" : v + " kΩ");

// ======================================================================
// Scene 1: open loop and closed loop
// ======================================================================
const L1 = { closed: false, vd: 20, noise: false, sine: false, vin: 1.5, vout: 0, hist: [], fbPath: null };
function s1Update(dt) {
  if (!L1.closed) {
    const n = L1.noise ? 1e-3 * (sin(TAU * 3.1 * t) + 0.6 * sin(TAU * 7.3 * t + 1)) / 1.6 : 0;
    L1.vdEff = (L1.sine ? L1.vd * sin(TAU * FV * t) : L1.vd) * 1e-6 + n;
    L1.vout = clip(AOL * L1.vdEff);
    L1.hist.push({ t, vd: L1.vdEff * 1e6, vout: L1.vout });
    while (L1.hist.length && L1.hist[0].t < t - 8) L1.hist.shift();
  } else {
    // Slowed-down op-amp: the output ramps at a rate set by the input difference
    const vm = L1.vout / 2;                       // R_f = R_in = 10 k: V- is half of V_out
    L1.vout = clip(L1.vout + 3.0 * (L1.vin - vm) * dt * 2);
    L1.hist.push({ t, vin: L1.vin, vm: L1.vout / 2, vout: L1.vout });
    while (L1.hist.length && L1.hist[0].t < t - 8) L1.hist.shift();
  }
}
function s1Draw() {
  header("Open Loop and Closed Loop", "An op-amp amplifies V_{+} − V_{−} about 200 000 times. Feedback tames that huge gain.");
  const A = opamp(400, 300, { name: "741" });
  if (!L1.closed) {
    // V- to 0 V, V+ from a tiny DC source
    poly([A.minus, [A.minus[0] - 60, A.minus[1]]]);
    ground(A.minus[0] - 60, A.minus[1]);
    poly([A.plus, [200, A.plus[1]], [200, A.plus[1] + 40]]);
    generator(200, A.plus[1] + 66, 26, CIN); poly([[200, A.plus[1] + 92], [200, A.plus[1] + 110]]); ground(200, A.plus[1] + 110);
    text(L1.sine ? "AC" : "DC", 160, A.plus[1] + 66, 14, CIN, "right", "bold");
    tag("V_{+} − V_{−} = " + (L1.vdEff * 1e6).toFixed(1) + " µV", 232, A.plus[1] + 66, CIN, "left");
    poly([A.out, [600, 300]]);
  } else {
    // non inverting, gain 2: R_f = R_in = 10 k (feedback in colour)
    const nx = A.minus[0] - 30;
    poly([A.minus, [nx, A.minus[1]]], FB); dot(nx, A.minus[1], 6, FB);
    poly([[nx, A.minus[1]], [nx, 170], [440, 170]], FB); zigH(440, 520, 170, FB); poly([[520, 170], [560, 170], [560, 300]], FB);
    text("R_f 10 kΩ", 480, 140, 16, FB, "center", "bold");
    poly([[nx, A.minus[1]], [nx - 30, A.minus[1]]]); zigH(nx - 130, nx - 30, A.minus[1]); poly([[nx - 130, A.minus[1]], [nx - 150, A.minus[1]], [nx - 150, A.minus[1] + 14]]); ground(nx - 150, A.minus[1] + 14);
    text("R_{in} 10 kΩ", nx - 80, A.minus[1] + 30, 16, INK, "center", "bold");
    poly([A.plus, [200, A.plus[1]], [200, A.plus[1] + 40]]);
    generator(200, A.plus[1] + 66, 26, CIN); poly([[200, A.plus[1] + 92], [200, A.plus[1] + 110]]); ground(200, A.plus[1] + 110);
    text("DC", 160, A.plus[1] + 66, 14, CIN, "right", "bold");
    poly([A.out, [600, 300]]); dot(560, 300, 6, FB);
    text("feedback", 600, 200, 17, FB, "left", "bold");
    tag("V_{+} = " + L1.vin.toFixed(2) + " V", 232, A.plus[1] + 66, CIN, "left");
    tag("V_{−} = " + (L1.vout / 2).toFixed(3) + " V", nx - 8, 235, CM, "right");
  }
  // output meter
  const mx = 610, my = 250;
  box(mx, my, 140, 100, "#fff", "#c5ccd8");
  text("V_{out}", mx + 70, my + 22, 16, MUTED, "center", "bold");
  text(L1.vout.toFixed(2) + " V", mx + 70, my + 56, 26, Math.abs(L1.vout) >= VSAT - 1e-6 ? BAD : COUT, "center", "bold");
  const bw = 120 * Math.abs(L1.vout) / 9;
  ctx.fillStyle = "#eef1f6"; ctx.fillRect(mx + 10, my + 80, 120, 8);
  ctx.fillStyle = Math.abs(L1.vout) >= VSAT - 1e-6 ? BAD : COUT; ctx.fillRect(mx + 70 - (L1.vout < 0 ? bw / 2 : 0), my + 80, bw / 2, 8);

  if (!L1.closed) {
    const want = AOL * L1.vdEff, sat = Math.abs(want) > VSAT;
    readout([
      { s: "V_{out} = 200 000 × (V_{+} − V_{−})", weight: "bold", color: COUT },
      sat ? { s: "SATURATED", color: BAD, weight: "bold", pill: true } : { s: "LINEAR", color: GOOD, weight: "bold", pill: true },
    ]);
    // time charts: input (µV) on top, output (V) below
    box(790, 24, 580, 720);
    text("Last 8 seconds", 810, 52, 19, INK, "left", "bold");
    const gx0 = 850, gx1 = 1350, X = tt => gx0 + (tt - (t - 8)) / 8 * (gx1 - gx0);
    const plot = (y0, y1, ymax, step, key, color, unit, band) => {
      const Y = v => (y0 + y1) / 2 - Math.max(-ymax, Math.min(ymax, v)) / ymax * (y1 - y0) / 2;
      if (band) { ctx.fillStyle = "#18a05814"; ctx.fillRect(gx0, Y(band), gx1 - gx0, Y(-band) - Y(band)); }
      ctx.strokeStyle = GRID; ctx.lineWidth = 1;
      for (let v = -ymax; v <= ymax + 1e-9; v += step) { ctx.beginPath(); ctx.moveTo(gx0, Y(v)); ctx.lineTo(gx1, Y(v)); ctx.stroke(); text(String(v), gx0 - 10, Y(v), 13, MUTED, "right"); }
      if (L1.hist.length > 1) poly(L1.hist.map(h => [X(h.t), Y(h[key])]), color, 3.5);
      return Y;
    };
    const ymax = L1.noise ? 1500 : 100;
    text("V_{+} − V_{−} (µV)", gx0, 88, 16, CIN, "left", "bold");
    const Yi = plot(105, 335, ymax, ymax / 2, "vd", CIN, "µV", ymax === 100 ? 37.5 : 0);
    if (ymax === 100) text("linear band ±37.5 µV", gx1, Yi(37.5) - 12, 13, GOOD, "right", "bold");
    text("V_{out} (V)", gx0, 400, 16, COUT, "left", "bold");
    const Yo = plot(420, 700, 9, 3, "vout", COUT, "V");
    for (const r of [VSAT, -VSAT]) poly([[gx0, Yo(r)], [gx1, Yo(r)]], BAD, 1.5, [7, 6]);
    text("+7.5 V", gx1, Yo(VSAT) - 12, 13, BAD, "right", "bold");
    text("−7.5 V", gx1, Yo(-VSAT) + 14, 13, BAD, "right", "bold");
  } else {
    const err = L1.vin - L1.vout / 2, steady = Math.abs(err) < 0.002;
    const sat = Math.abs(L1.vout) >= VSAT - 1e-6;
    readout([
      { s: "Gain = 1 + R_f ÷ R_{in} = 2", weight: "bold", color: FB },
      sat ? { s: "SATURATED", color: BAD, weight: "bold", pill: true }
          : steady ? { s: "SETTLED:  V_{−} = V_{+}", color: GOOD, weight: "bold", pill: true }
                   : { s: "ADJUSTING", color: CIN, weight: "bold", pill: true },
    ]);
    // time chart
    box(790, 24, 580, 720);
    text("Last 8 seconds", 810, 52, 19, INK, "left", "bold");
    const gx0 = 840, gx1 = 1350, gy0 = 90, gy1 = 640;
    const X = tt => gx0 + (tt - (t - 8)) / 8 * (gx1 - gx0), Y = v => (gy0 + gy1) / 2 - v / 9 * (gy1 - gy0) / 2;
    ctx.strokeStyle = GRID; ctx.lineWidth = 1;
    for (let v = -9; v <= 9; v += 3) { ctx.beginPath(); ctx.moveTo(gx0, Y(v)); ctx.lineTo(gx1, Y(v)); ctx.stroke(); text(String(v), gx0 - 10, Y(v), 13, MUTED, "right"); }
    for (const r of [VSAT, -VSAT]) poly([[gx0, Y(r)], [gx1, Y(r)]], BAD + "88", 1.5, [7, 6]);
    const tr = (key, color, w, dash) => { if (L1.hist.length > 1) poly(L1.hist.map(h => [X(h.t), Y(h[key])]), color, w, dash); };
    tr("vin", CIN, 3); tr("vm", CM, 3, [8, 6]); tr("vout", COUT, 4);
    let lx = gx0;
    for (const [lab, c, d] of [["V_{+} (input)", CIN], ["V_{−} (fed back)", CM, [8, 6]], ["V_{out}", COUT]]) {
      poly([[lx, gy1 + 40], [lx + 24, gy1 + 40]], c, 4, d); lx = text(lab, lx + 30, gy1 + 40, 15, INK, "left", "bold") + 24;
    }
  }
}
function s1Controls() {
  addBtn("Open loop", !L1.closed, () => { L1.closed = false; L1.hist = []; setScene(0); });
  addBtn("Closed loop", L1.closed, () => { L1.closed = true; L1.hist = []; setScene(0); });
  if (!L1.closed) {
    addSlider("V_{+} − V_{−}", -100, 100, 1, L1.vd, v => (L1.vd = v), v => v + " µV");

function s6Controls() {
  addSlider("Noise", 0, 3, 0.1, D6.noise, v => (D6.noise = v), v => v.toFixed(1) + " V");
  addSlider("R_4 mismatch", 0, 20, 1, D6.mis, v => (D6.mis = v), v => v + " %");
  addBtn("One wire only (no differential)", D6.single, b => { D6.single = !D6.single; b.classList.toggle("warn", D6.single); });
}

// ======================================================================
// Controls (HTML bar)
// ======================================================================
const tabs = document.getElementById("tabs"), ctl = document.getElementById("ctl");
const DRAW = [s1Draw, s2Draw, s3Draw, s4Draw, s5Draw, s6Draw];
const CTRL = [s1Controls, s2Controls, s3Controls, s4Controls, s5Controls, s6Controls];
function html(s) { return s.replace(/_\{([^}]*)\}/g, "<sub>$1</sub>").replace(/_([a-z0-9]+)/g, "<sub>$1</sub>"); }
function addBtn(label, on, fn) {
  const b = document.createElement("button"); b.innerHTML = html(label); if (on) b.classList.add("on");
  b.addEventListener("click", () => fn(b)); ctl.appendChild(b); return b;
}
function addSlider(label, min, max, step, value, fn, fmt) {
  const l = document.createElement("label"); l.innerHTML = html(label);
  const i = document.createElement("input"); i.type = "range"; i.min = min; i.max = max; i.step = step; i.value = value;
  const o = document.createElement("span"); o.className = "val"; o.textContent = fmt(+value);
  i.addEventListener("input", () => { fn(+i.value); o.textContent = fmt(+i.value); });
  ctl.append(l, i, o); return { input: i, out: o };
}
function addList(label, list, value, fn, fmt) {     // slider over a list of standard values
  let idx = Math.max(0, list.indexOf(value));
  return addSlider(label, 0, list.length - 1, 1, idx, k => fn(list[k]), k => fmt(list[k]));
}
function setScene(k) {
  scene = k;
  tabs.innerHTML = "";
  SCENES.forEach((s, i) => { const b = document.createElement("button"); b.textContent = s.name; if (i === k) b.classList.add("on"); b.addEventListener("click", () => setScene(i)); tabs.appendChild(b); });
  const sp = document.createElement("span"); sp.className = "sp"; tabs.appendChild(sp);
  const pb = document.createElement("button"); pb.textContent = paused ? "Play (Space)" : "Pause (Space)"; pb.id = "pause";
  pb.addEventListener("click", togglePause); tabs.appendChild(pb);
  const ks = document.createElement("span"); ks.className = "keys"; ks.textContent = "1 to 6: scenes   F: fullscreen"; tabs.appendChild(ks);
  ctl.innerHTML = ""; gainSlider = null; CTRL[k]();
}
function togglePause() { paused = !paused; const b = document.getElementById("pause"); if (b) b.textContent = paused ? "Play (Space)" : "Pause (Space)"; }
window.addEventListener("keydown", e => {
  if (e.key >= "1" && e.key <= "6") setScene(+e.key - 1);
  else if (e.key === " ") { e.preventDefault(); togglePause(); }
  else if (e.key === "f" || e.key === "F") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
});
// knob drag (scene 4)
function canvasXY(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
cv.addEventListener("pointerdown", e => {
  if (scene !== 3) return; const [x, y] = canvasXY(e);
  if (Math.hypot(x - KNOB.x, y - KNOB.y) < KNOB.r + 14) { dragKnob = true; cv.setPointerCapture(e.pointerId); knobTo(x, y); }
});
cv.addEventListener("pointermove", e => { if (dragKnob) { const [x, y] = canvasXY(e); knobTo(x, y); } });
cv.addEventListener("pointerup", () => { dragKnob = false; });
function knobTo(x, y) {
  let a = Math.atan2(x - KNOB.x, -(y - KNOB.y)) * 180 / Math.PI;     // 0 = straight up
  a = Math.max(-135, Math.min(135, a));
  AMP.gain.rf = Math.round((a + 135) / 270 * 100); syncGain();
}

// ======================================================================
// Main loop
// ======================================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  lastDt = paused ? 0 : dt;
  if (!paused) t += dt;
  if (scene === 0 && !paused) s1Update(dt);
  ctx.fillStyle = "#f6f7fb"; ctx.fillRect(0, 0, W, H);
  DRAW[scene]();
  requestAnimationFrame(frame);
}
setScene(0); fit(); requestAnimationFrame(frame);
</script>
</body>
</html>
